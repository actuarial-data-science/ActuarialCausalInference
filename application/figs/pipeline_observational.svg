<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 920 800" font-family="Helvetica, Arial, sans-serif">
  <style>
    /* Three roles only: grey = steps, limegreen = decision gate, red = failure/remedy */
    /* Connectors / arrows */
    .conn { stroke: #6d6e71; }
    .conn-mk { fill: #6d6e71; }
    /* Group container */
    .grp { fill: #f4f5f5; stroke: #8a8b8e; }
    .grp-t { fill: #42434a; }
    /* Grey - process steps, inputs, report */
    .grey-b { fill: #eceded; stroke: #8a8b8e; }
    .grey-t { fill: #42434a; }
    .grey-s { fill: #5f6066; }
    /* Limegreen - decision gate */
    .lime-b { fill: #eef3dd; stroke: #7d9f17; }
    .lime-t { fill: #3d4f10; }
    /* Red - failure / remedy */
    .red-b { fill: #fdecea; stroke: #e53935; }
    .red-t { fill: #8e1d18; }
    .red-s { fill: #a8332c; }
    /* Decision labels */
    .fail-t { fill: #c62828; }
    .pass-t { fill: #5b7510; }

    @media (prefers-color-scheme: dark) {
      .conn { stroke: #9aa4af; }
      .conn-mk { fill: #9aa4af; }
      .grp { fill: #161b22; stroke: #7c7e85; }
      .grp-t { fill: #c9cdd3; }
      .grey-b { fill: #1b1f24; stroke: #7c7e85; }
      .grey-t { fill: #c9cdd3; }
      .grey-s { fill: #a7abb2; }
      .lime-b { fill: #1f2a10; stroke: #aacb3f; }
      .lime-t { fill: #cfe39a; }
      .red-b { fill: #3a1715; stroke: #f06a66; }
      .red-t { fill: #ffb3ae; }
      .red-s { fill: #f0918c; }
      .fail-t { fill: #f06a66; }
      .pass-t { fill: #aacb3f; }
    }
  </style>
  <defs>
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto" markerUnits="strokeWidth">
      <path class="conn-mk" d="M0,0 L8,3 L0,6 Z"/>
    </marker>
  </defs>

  <!-- ===================== Boxes ===================== -->
  <!-- A: data -->
  <rect class="grey-b" x="310" y="30" width="300" height="52" rx="8" stroke-width="2"/>
  <text class="grey-t" x="460" y="61" text-anchor="middle" font-size="15" font-weight="bold">Observational data  (X &#183; T &#183; Y)</text>

  <!-- B: encode DAG -->
  <rect class="grey-b" x="280" y="124" width="360" height="52" rx="8" stroke-width="2"/>
  <text class="grey-t" x="460" y="155" text-anchor="middle" font-size="15" font-weight="bold">1 &#183; Encode assumptions in a causal DAG</text>

  <!-- Group: validate -->
  <rect class="grp" x="40" y="212" width="840" height="140" rx="10" stroke-width="1.6" stroke-dasharray="6 4"/>
  <text class="grp-t" x="460" y="236" text-anchor="middle" font-size="14.5" font-weight="bold">2 &#183; Validate the four identification assumptions</text>

  <!-- C1 -->
  <rect class="grey-b" x="60" y="254" width="170" height="80" rx="8" stroke-width="2"/>
  <text class="grey-t" x="145" y="290" text-anchor="middle" font-size="13.5" font-weight="bold">Consistency</text>
  <text class="grey-s" x="145" y="310" text-anchor="middle" font-size="11">effect by sub-type</text>

  <!-- C2 -->
  <rect class="grey-b" x="270" y="254" width="170" height="80" rx="8" stroke-width="2"/>
  <text class="grey-t" x="355" y="290" text-anchor="middle" font-size="13.5" font-weight="bold">SUTVA</text>
  <text class="grey-s" x="355" y="310" text-anchor="middle" font-size="11">spillover check</text>

  <!-- C3 -->
  <rect class="grey-b" x="480" y="254" width="170" height="80" rx="8" stroke-width="2"/>
  <text class="grey-t" x="565" y="290" text-anchor="middle" font-size="13.5" font-weight="bold">Positivity</text>
  <text class="grey-s" x="565" y="310" text-anchor="middle" font-size="11">propensity overlap</text>

  <!-- C4 -->
  <rect class="grey-b" x="690" y="254" width="170" height="80" rx="8" stroke-width="2"/>
  <text class="grey-t" x="775" y="290" text-anchor="middle" font-size="13.5" font-weight="bold">Exchangeability</text>
  <text class="grey-s" x="775" y="310" text-anchor="middle" font-size="11">balance + sensitivity</text>

  <!-- D: decision diamond -->
  <polygon class="lime-b" points="460,378 590,430 460,482 330,430" stroke-width="2"/>
  <text class="lime-t" x="460" y="426" text-anchor="middle" font-size="13.5" font-weight="bold">3 &#183; Any assumption</text>
  <text class="lime-t" x="460" y="443" text-anchor="middle" font-size="13.5" font-weight="bold">violated?</text>

  <!-- F: remedy -->
  <rect class="red-b" x="40" y="540" width="300" height="56" rx="8" stroke-width="2"/>
  <text class="red-t" x="190" y="564" text-anchor="middle" font-size="13" font-weight="bold">Apply remedy</text>
  <text class="red-s" x="190" y="582" text-anchor="middle" font-size="11">redefine &#183; cluster &#183; trim &#183; reweight &#183; IV</text>

  <!-- G: re-estimate -->
  <rect class="grey-b" x="40" y="630" width="300" height="56" rx="8" stroke-width="2"/>
  <text class="grey-t" x="190" y="654" text-anchor="middle" font-size="13" font-weight="bold">Re-estimate &amp; quantify robustness</text>
  <text class="grey-s" x="190" y="672" text-anchor="middle" font-size="11">E-value &#183; &#915; &#183; partial R&#178;</text>

  <!-- E: report estimate -->
  <rect class="grey-b" x="570" y="630" width="260" height="56" rx="8" stroke-width="2"/>
  <text class="grey-t" x="700" y="654" text-anchor="middle" font-size="13" font-weight="bold">Report adjusted</text>
  <text class="grey-t" x="700" y="672" text-anchor="middle" font-size="13" font-weight="bold">effect estimate</text>

  <!-- H: transparent report -->
  <rect class="grey-b" x="250" y="720" width="420" height="56" rx="8" stroke-width="2.4"/>
  <text class="grey-t" x="460" y="744" text-anchor="middle" font-size="14" font-weight="bold">Transparent report</text>
  <text class="grey-s" x="460" y="762" text-anchor="middle" font-size="11">estimate + diagnostics + sensitivity bounds</text>

  <!-- ===================== Arrows ===================== -->
  <line class="conn" x1="460" y1="82"  x2="460" y2="121" stroke-width="2" marker-end="url(#arrow)"/>
  <line class="conn" x1="460" y1="176" x2="460" y2="209" stroke-width="2" marker-end="url(#arrow)"/>
  <line class="conn" x1="460" y1="352" x2="460" y2="375" stroke-width="2" marker-end="url(#arrow)"/>

  <!-- D -> F (Yes) -->
  <polyline class="conn" points="460,482 460,512 190,512 190,537" fill="none" stroke-width="2" marker-end="url(#arrow)"/>
  <text class="fail-t" x="300" y="505" text-anchor="middle" font-size="12.5" font-weight="bold">Yes</text>

  <!-- D -> E (No) -->
  <polyline class="conn" points="590,430 700,430 700,627" fill="none" stroke-width="2" marker-end="url(#arrow)"/>
  <text class="pass-t" x="648" y="422" text-anchor="middle" font-size="12.5" font-weight="bold">No</text>

  <!-- F -> G -->
  <line class="conn" x1="190" y1="596" x2="190" y2="627" stroke-width="2" marker-end="url(#arrow)"/>

  <!-- G -> E -->
  <line class="conn" x1="340" y1="658" x2="567" y2="658" stroke-width="2" marker-end="url(#arrow)"/>

  <!-- E -> H -->
  <polyline class="conn" points="700,686 700,704 460,704 460,717" fill="none" stroke-width="2" marker-end="url(#arrow)"/>
</svg>
